<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b1f">
<title>AR фото</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#070b1f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
model-viewer{width:100%;height:100%;background:#070b1f}
#ar{background:#fff;color:#111;border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:700;box-shadow:0 8px 28px #0008}
#msg{position:fixed;top:14px;left:14px;right:14px;text-align:center;z-index:4;background:#000a;padding:10px;border-radius:12px;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div id="msg">Загрузка AR…</div>
<model-viewer id="mv" camera-controls ar ar-modes="webxr" ar-placement="floor" ar-scale="fixed" shadow-intensity="0" exposure="1">
<button id="ar" slot="ar-button">Поставить в комнату</button>
</model-viewer>
<script>
(async()=>{
 try{
  const files=['chunks/part_00.b64','chunks/part_01.b64','chunks/part_02.b64','chunks/part_03.b64','chunks/part_04.b64','chunks/part_05.b64','chunks/part_06.b64'];
  const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return(await r.text()).trim()}));
  const raw=atob(parts.join(''));
  const a=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);
  const u=URL.createObjectURL(new Blob([a],{type:'model/gltf-binary'}));
  const mv=document.getElementById('mv');
  mv.src=u;
  mv.addEventListener('load',()=>{document.getElementById('msg').textContent='Готово. Нажмите «Поставить в комнату».'},{once:true});
 }catch(e){document.getElementById('msg').textContent='Ошибка загрузки AR: '+e.message;}
})();
</script>
</body>
</html>
