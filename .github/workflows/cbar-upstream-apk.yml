name: Build upstream Cambrian CBAR APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cbar:
    if: startsWith(github.head_ref, 'chatgpt/cbar-upstream-apk-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Checkout original Cambrian CBAR
        uses: actions/checkout@v4
        with:
          repository: CambrianTech/cb-mobile-sdk
          ref: develop
          path: cb-base
          fetch-depth: 1

      - name: Set up Java 17 for modern sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install legacy Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-27" "platforms;android-26" "build-tools;27.0.3" "build-tools;26.0.2" "platform-tools" "cmake;3.6.4111459" "ndk;16.1.4479499"
          echo "sdk.dir=$SDKROOT" > cb-base/android/Harmony/local.properties
          echo "ndk.dir=$SDKROOT/ndk/16.1.4479499" >> cb-base/android/Harmony/local.properties

      - name: Set up Java 8 for upstream Gradle 4.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore legacy source layout expected by upstream Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cb-base/cb-cpp/src
          ln -sfn ../../../cpp cb-base/cb-cpp/src/cb-cpp
          test -d cb-base/prebuilts
          test -d cb-base/cpp

      - name: Set up Gradle 4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.1'

      - name: Build upstream debug APK
        working-directory: cb-base/android/Harmony
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleHarmonyDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          find cb-base/android/Harmony/app/build/outputs -type f -name '*.apk' -print
          APK="$(find cb-base/android/Harmony/app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p cbar_dist
          cp "$APK" cbar_dist/Cambrian_CBAR_Upstream_Harmony.apk
          sha256sum cbar_dist/Cambrian_CBAR_Upstream_Harmony.apk > cbar_dist/Cambrian_CBAR_Upstream_Harmony.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cambrian_CBAR_Upstream_Harmony
          path: cbar_dist/*
          if-no-files-found: error
          retention-days: 7
