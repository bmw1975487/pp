name: Build EYRIL raw shell v0.2.0

on:
  push:
    branches: [eyril-public-builder-v020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble EYRIL v0.2.0 source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eyril"
          base64 -d eyril_v020/source.b64 > "$RUNNER_TEMP/source.zip"
          unzip -t "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/eyril"
          test -f "$RUNNER_TEMP/eyril/project.godot"
          test -f "$RUNNER_TEMP/eyril/scripts/main.gd"

      - name: Create placeholder raw assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eyril/assets/raw"
          for n in main_splash S001 S002 S003 S004 S005 S006 S007 S008 S009 S010; do
            base64 -d eyril_shell/placeholder.b64 > "$RUNNER_TEMP/eyril/assets/raw/$n.dat"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64, wave, struct, math
          root = Path('${{ runner.temp }}/eyril/assets/raw')
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl3nWQAAAAASUVORK5CYII=')
          for n in ['ui_button_blank','ui_next','ui_back','ui_continue','ui_round','ui_panel']:
              (root/f'{n}.dat').write_bytes(png)
          wav_names = [f'voice_S{i:03d}' for i in range(1,11)] + ['music_city','music_anomaly','amb_rain','amb_clock','sfx_click','sfx_magic','sfx_time_stop','sfx_metal','sfx_tram']
          for n in wav_names:
              p = root/f'{n}.dat'
              with wave.open(str(p),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(24000)
                  frames=[]
                  for i in range(2400):
                      v=int(300*math.sin(2*math.pi*220*i/24000))
                      frames.append(struct.pack('<h',v))
                  w.writeframes(b''.join(frames))
          print('raw placeholder count', len(list(root.glob('*.dat'))))
          PY
          find "$RUNNER_TEMP/eyril/assets/raw" -type f -maxdepth 1 -printf '%f %s\n' | sort

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fL --retry 4 -o godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip'
          unzip -q godot.zip && chmod +x Godot_v4.7.1-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" > "$RUNNER_TEMP/godot_path.txt"
          curl -fL --retry 4 -o templates.tpz 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz'
          mkdir tpl && unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -a tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/eyril/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=EYRIL,C=US'

      - name: Godot parser smoke test
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          timeout 30s "$GODOT" --headless --editor --path "$RUNNER_TEMP/eyril" --quit-after 5

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/eyril/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          mkdir -p "$RUNNER_TEMP/eyril/build"
          set +e
          timeout 180s "$GODOT" --headless --path "$RUNNER_TEMP/eyril" --export-debug Android "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.0.apk" > "$RUNNER_TEMP/eyril/build/export.log" 2>&1
          CODE=$?
          set -e
          cat "$RUNNER_TEMP/eyril/build/export.log"
          if [ "$CODE" -ne 0 ] || [ ! -s "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.0.apk" ]; then
            MSG=$(tail -c 7000 "$RUNNER_TEMP/eyril/build/export.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Godot Android export failed::$MSG"
            exit 1
          fi
          unzip -l "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.0.apk" > "$RUNNER_TEMP/eyril/build/apk_listing.txt"
          grep -E 'assets/raw|sparsepck|AndroidManifest' "$RUNNER_TEMP/eyril/build/apk_listing.txt" | tail -50 || true
          sha256sum "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.0.apk" > "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.0.apk.sha256"

      - name: Collect signing tools
        shell: bash
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/sign_tools"
          cp "$BT/zipalign" "$RUNNER_TEMP/sign_tools/"
          cp "$BT/lib/apksigner.jar" "$RUNNER_TEMP/sign_tools/"
          chmod +x "$RUNNER_TEMP/sign_tools/zipalign"
          echo "$(basename "$BT")" > "$RUNNER_TEMP/sign_tools/version.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: EYRIL_SHELL_v0.2.0
          path: |
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.2.0.apk
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.2.0.apk.sha256
            ${{ runner.temp }}/eyril/build/apk_listing.txt
            ${{ runner.temp }}/eyril/build/export.log
            ${{ runner.temp }}/sign_tools/zipalign
            ${{ runner.temp }}/sign_tools/apksigner.jar
            ${{ runner.temp }}/sign_tools/version.txt
          compression-level: 0
          retention-days: 1
