name: Godot Toolchain Artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download minimal Godot 4.7.1 toolchain
        run: |
          set -euxo pipefail
          mkdir -p payload/editor payload/templates unpacked_templates
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip -d payload/editor
          unzip -q Godot_v4.7.1-stable_export_templates.tpz -d unpacked_templates
          chmod +x payload/editor/Godot_v4.7.1-stable_linux.x86_64
          payload/editor/Godot_v4.7.1-stable_linux.x86_64 --version
          find unpacked_templates -type f -name 'android_*.apk' -exec cp -v {} payload/templates/ \;
          find unpacked_templates -type f -name 'version.txt' -exec cp -v {} payload/templates/ \;
          test -f payload/templates/android_debug.apk
          test -f payload/templates/android_release.apk
          find payload -type f -printf '%p %s\n' | sort
      - name: Upload minimal toolchain
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.1-minimal-toolchain
          path: payload
          compression-level: 6
          retention-days: 1
