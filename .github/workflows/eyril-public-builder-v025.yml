name: Build EYRIL raw shell v0.2.5

on:
  push:
    branches: [eyril-public-builder-v025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/eyril"
          cat eyril_v025/chunks/c00 eyril_v025/chunks/c01 eyril_v025/chunks/c02 eyril_v025/chunks/c03 eyril_v025/chunks/c04 eyril_v025/chunks/c05 eyril_v025/chunks/c06 > "$RUNNER_TEMP/source.b64"
          test "$(wc -c < "$RUNNER_TEMP/source.b64")" -eq 26848
          base64 -d "$RUNNER_TEMP/source.b64" > "$RUNNER_TEMP/source.zip"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/source.zip" | cut -d' ' -f1)"
          test "$(sha256sum "$RUNNER_TEMP/source.zip" | cut -d' ' -f1)" = "07ec0eaa150a98c47ffa1b584fe92a02007939b8ee936f412dde6e3762f2cb4d"
          unzip -t "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/eyril"
          test -f "$RUNNER_TEMP/eyril/scripts/main.gd"

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 -o godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip'
          unzip -q godot.zip && chmod +x Godot_v4.7.1-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" > "$RUNNER_TEMP/godot_path.txt"
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 -o templates.tpz 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz'
          mkdir tpl && unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -a tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/eyril/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=EYRIL,C=US'

      - name: Godot parser smoke test
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          timeout 40s "$GODOT" --headless --editor --path "$RUNNER_TEMP/eyril" --quit-after 8

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/eyril/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          mkdir -p "$RUNNER_TEMP/eyril/build"
          timeout 180s "$GODOT" --headless --path "$RUNNER_TEMP/eyril" --export-debug Android "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.5.apk"
          test -s "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.5.apk"
          sha256sum "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.5.apk" > "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.2.5.apk.sha256"

      - name: Collect signing tools
        shell: bash
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/sign_tools"
          cp "$BT/zipalign" "$RUNNER_TEMP/sign_tools/"
          cp "$BT/lib/apksigner.jar" "$RUNNER_TEMP/sign_tools/"
          ldd "$BT/zipalign" | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}' | sort -u | while read f; do cp -L "$f" "$RUNNER_TEMP/sign_tools/" || true; done
          chmod +x "$RUNNER_TEMP/sign_tools/zipalign"

      - uses: actions/upload-artifact@v4
        with:
          name: EYRIL_SHELL_v0.2.5
          path: |
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.2.5.apk
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.2.5.apk.sha256
            ${{ runner.temp }}/sign_tools/*
          compression-level: 0
          retention-days: 1
