name: AI Access One NoProfile

on:
  push:
    branches: [ ai-access-build ]
    paths:
      - 'ai-access-orbot/**'
      - '.github/workflows/ai-access-one-noprofile.yml'
      - 'ai-access-one/NOPROFILE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' 'platform-tools' 'ndk;29.0.14206865'

      - name: Clone pinned Orbot source
        run: |
          git clone https://github.com/guardianproject/orbot-android.git orbot-src
          cd orbot-src
          git checkout 521d18aa3cd320f5762a57e0bcf9fcf0c8eba15a
          git submodule update --init --recursive

      - name: Apply BootstrapGate and NoProfile patches
        run: |
          python3 ai-access-orbot/patch_orbot.py orbot-src ai-access-orbot/overlay
          python3 ai-access-orbot/patch_noprofile.py orbot-src
          grep -n 'com.bmw1975487.aione.routefix5' orbot-src/app/build.gradle.kts
          grep -n '0.2.5-noprofile' orbot-src/app/build.gradle.kts
          grep -n 'AI_ACCESS_STRICT_ROUTE' orbot-src/app/src/main/java/org/torproject/android/service/vpn/OrbotVpnManager.java
          grep -n 'builder.addAllowedApplication(targetPackage)' orbot-src/app/src/main/java/org/torproject/android/service/vpn/OrbotVpnManager.java
          grep -n 'CHATGPT_TARGET_MODE' orbot-src/app/src/main/java/org/torproject/android/AiAccessActivity.java
          ! grep -n 'том же профиле Android' orbot-src/app/src/main/java/org/torproject/android/AiAccessActivity.java
          grep -n 'BOOTSTRAP_GATE_OPEN' orbot-src/app/src/main/java/org/torproject/android/AiAccessActivity.java
          grep -n 'ROUTE_PROBE_BLOCKED' orbot-src/app/src/main/java/org/torproject/android/AiAccessActivity.java

      - name: Build arm64 APK
        working-directory: orbot-src
        run: ./gradlew --no-daemon --stacktrace assembleFullpermDebug

      - name: Verify APK
        run: |
          APK=$(find orbot-src/app/build/outputs/apk/fullperm/debug -type f -name '*.apk' | grep -E 'arm64|v8a' | head -1)
          if [ -z "$APK" ]; then APK=$(find orbot-src/app/build/outputs/apk/fullperm/debug -type f -name '*.apk' | head -1); fi
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee ai-access-orbot/build-info-v025.txt
          sha256sum "$APK" | tee ai-access-orbot/route-apk-v025.sha256
          echo '--- native payload ---' | tee -a ai-access-orbot/build-info-v025.txt
          unzip -l "$APK" | grep -E 'arm64-v8a|libtor|libhev|libgojni|lib.*proxy' | tee -a ai-access-orbot/build-info-v025.txt || true
          echo '--- required feature markers ---' | tee -a ai-access-orbot/build-info-v025.txt
          for DEX in $(zipinfo -1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$DEX" | strings; done | grep -E '0.2.5-noprofile|AI_ACCESS_STRICT_ROUTE|CHATGPT_TARGET_MODE|BOOTSTRAP_GATE_OPEN|ROUTE_PROBE_BLOCKED|LOG_SHARE_TELEGRAM|LOG_DOWNLOADS_SAVED' | head -80 | tee -a ai-access-orbot/build-info-v025.txt || true
          cp "$APK" ai-access-orbot/AI_Access_One_v0.2.5_NOPROFILE_arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_Access_One_v0.2.5_NOPROFILE_arm64
          path: |
            ai-access-orbot/AI_Access_One_v0.2.5_NOPROFILE_arm64.apk
            ai-access-orbot/route-apk-v025.sha256
            ai-access-orbot/build-info-v025.txt
          if-no-files-found: error
          retention-days: 7
