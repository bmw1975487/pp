name: Build public AR GLB 20260831

on:
  push:
    paths:
      - '.github/workflows/build_ar_public_20260831.yml'
      - 'ar_public_20260831/chunks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild GLB from public chunks
        shell: bash
        run: |
          cat ar_public_20260831/chunks/part_*.b64 | tr -d '\n\r ' | base64 -d > ar_public_20260831/character_ar_max.glb
          test "$(stat -c%s ar_public_20260831/character_ar_max.glb)" -eq 68536
      - name: Validate GLB magic
        shell: bash
        run: |
          test "$(head -c 4 ar_public_20260831/character_ar_max.glb)" = "glTF"
      - name: Commit binary GLB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar_public_20260831/character_ar_max.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build public AR GLB binary"
          git push
