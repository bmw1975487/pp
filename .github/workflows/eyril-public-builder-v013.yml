name: Build EYRIL Godot shell v0.1.3

on:
  push:
    branches:
      - eyril-public-builder-v013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble project
        shell: bash
        run: |
          : > "$RUNNER_TEMP/EYRIL_PUBLIC_PLACEHOLDER.zip"
          for f in eyril_build/chunks/b_*; do
            base64 -d "$f" >> "$RUNNER_TEMP/EYRIL_PUBLIC_PLACEHOLDER.zip"
          done
          unzip -t "$RUNNER_TEMP/EYRIL_PUBLIC_PLACEHOLDER.zip"
          mkdir -p "$RUNNER_TEMP/eyril"
          unzip -q "$RUNNER_TEMP/EYRIL_PUBLIC_PLACEHOLDER.zip" -d "$RUNNER_TEMP/eyril"
          test -f "$RUNNER_TEMP/eyril/project.godot"

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl -fL --retry 4 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot/Godot_v4.7.1-stable_linux.x86_64" > "$RUNNER_TEMP/godot_path.txt"
          curl -fL --retry 4 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz"
          mkdir -p tpl
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          if [ -d tpl/templates ]; then
            cp -a tpl/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          else
            cp -a tpl/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          fi

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/eyril/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=EYRIL,C=US"

      - name: Configure Android SDK paths
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          "$GODOT" --headless --editor --path "$RUNNER_TEMP/eyril" --script res://tools/setup_android.gd

      - name: Import and parser smoke test
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          "$GODOT" --headless --editor --path "$RUNNER_TEMP/eyril" --quit-after 8

      - name: Runtime smoke test
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          "$GODOT" --headless --path "$RUNNER_TEMP/eyril" --quit-after 4

      - name: Export Android debug APK
        shell: bash
        run: |
          GODOT="$(cat "$RUNNER_TEMP/godot_path.txt")"
          mkdir -p "$RUNNER_TEMP/eyril/build"
          "$GODOT" --headless --path "$RUNNER_TEMP/eyril" --export-debug "Android" "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.1.3.apk"
          test -s "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.1.3.apk"
          sha256sum "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.1.3.apk" > "$RUNNER_TEMP/eyril/build/EYRIL_SHELL_v0.1.3.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: EYRIL_SHELL_v0.1.3_APK
          path: |
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.1.3.apk
            ${{ runner.temp }}/eyril/build/EYRIL_SHELL_v0.1.3.apk.sha256
          compression-level: 0
          retention-days: 1
