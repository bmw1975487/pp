name: RoomVision 5.8 Surface Gothic APK

on:
  push:
    paths:
      - '.github/workflows/roomvision58_surface.yml'
      - 'roomvision58_override_parts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: roomvision58-surface-gothic
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore 5.5 base and apply 5.8 surface override
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat roomvision55_seed/part_*.b64 | tr -d '\n\r ' | base64 -d | tar -xz
          cat roomvision58_override_parts/part_*.b64 | tr -d '\n\r ' | base64 -d | tar -xz

          grep -F 'versionName = "5.8.0"' app/build.gradle.kts
          grep -F 'versionCode = 58' app/build.gradle.kts
          grep -F 'org.opencv:opencv:4.13.0' app/build.gradle.kts
          grep -F 'Room Vision Gothic 5.8' app/src/main/res/values/strings.xml
          grep -F 'pyrMeanShiftFiltering(rgb, shifted, 11.0, 22.0)' app/src/main/java/com/roomvision/demo/SurfaceGothicEngine.java
          grep -F 'Canny(gray, edges, 90.0, 100.0)' app/src/main/java/com/roomvision/demo/SurfaceGothicEngine.java
          grep -F 'no castle bitmap, no fixed cracks, no screen-space fog' app/src/main/java/com/roomvision/demo/SurfaceGothicEngine.java
          grep -F 'SurfaceGothicEngine e = surfaceGothic' app/src/main/java/com/roomvision/demo/NeuralCameraController.java
          if grep -A30 'private Bitmap renderGothic' app/src/main/java/com/roomvision/demo/NeuralCameraController.java | grep -Eq 'gothicGpuFallback\.render|cge\.render'; then
            echo 'ERROR: screen overlay renderer still active in Gothic'; exit 1
          fi
          if grep -q 'gothicArView=new GothicArView' app/src/main/java/com/roomvision/demo/MainActivity.java; then
            echo 'ERROR: ARCore view still created'; exit 2
          fi

      - name: Generate base visual assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python generate_assets_ci.py
          test -s app/src/main/res/drawable/icon.png
          stat -c 'icon_bytes=%s' app/src/main/res/drawable/icon.png | tee reports/generated-assets.txt

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 / Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint test assemble
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee reports/build.log

      - name: Verify 5.8 surface APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee reports/apksigner.txt
          "$BT/aapt2" dump badging "$APK" | tee reports/aapt2-badging.txt
          grep -F "versionName='5.8.0'" reports/aapt2-badging.txt
          grep -F "application-label:'Room Vision Gothic 5.8'" reports/aapt2-badging.txt
          unzip -l "$APK" | tee reports/apk-files.txt
          grep -F 'lib/arm64-v8a/libopencv_java4.so' reports/apk-files.txt
          for d in $(zipinfo -1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$d"; done | strings > reports/dex-strings.txt
          grep -F 'SurfaceGothicEngine' reports/dex-strings.txt
          grep -F 'pyrMeanShiftFiltering' reports/dex-strings.txt
          grep -F 'OpenCVLoader' reports/dex-strings.txt
          mkdir -p dist
          cp "$APK" dist/RoomVision_Gothic_5.8.0_SURFACE_REFERENCE.apk
          stat -c 'apk_bytes=%s' dist/RoomVision_Gothic_5.8.0_SURFACE_REFERENCE.apk | tee reports/apk-size.txt
          sha256sum dist/RoomVision_Gothic_5.8.0_SURFACE_REFERENCE.apk | tee dist/SHA256.txt

      - name: Package source
        if: success()
        shell: bash
        run: |
          zip -qr dist/RoomVision_Gothic_5.8.0_SURFACE_REFERENCE_Source.zip app build.gradle.kts settings.gradle.kts gradle.properties generate_assets_ci.py reports -x 'app/build/*' 'build/*'

      - name: Upload APK source and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Gothic_5.8.0_SURFACE_REFERENCE
          path: |
            dist/*
            reports/*
          if-no-files-found: warn
          retention-days: 14
