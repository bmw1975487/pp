name: AI Access One Bootstrap
on:
  push:
    branches: [ ai-access-build ]
    paths: [ 'ai-access-one/**', '.github/workflows/ai-access-one-bootstrap.yml' ]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-access-one } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.1' }
      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Build
        run: gradle --no-daemon --stacktrace :app:assembleBootstrapDebug
      - name: Verify
        run: |
          APK=$(find app/build/outputs/apk/bootstrap/debug -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee bootstrap-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Access_One_v0.1.0_BOOTSTRAP
          path: |
            ai-access-one/app/build/outputs/apk/bootstrap/debug/*.apk
            ai-access-one/bootstrap-apk.sha256
          if-no-files-found: error
