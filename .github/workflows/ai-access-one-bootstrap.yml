name: AI Access One Diagnostic

on:
  push:
    branches: [ ai-access-build ]
    paths:
      - 'ai-access-one/**'
      - '.github/workflows/ai-access-one-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-access-one
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Build diagnostic APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee diagnostic-apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI_Access_One_v0.1.2_DIAGFIX
          path: |
            ai-access-one/app/build/outputs/apk/debug/*.apk
            ai-access-one/diagnostic-apk.sha256
          if-no-files-found: error
          retention-days: 7
