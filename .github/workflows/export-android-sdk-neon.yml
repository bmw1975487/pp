name: Export Android Toolchain for NEON

on:
  push:
    branches:
      - tools/android-sdk-export-neon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'platform-tools'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/37.0.0/zipalign"

      - name: Prepare Gradle 9.5.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o /tmp/gradle-9.5.0-bin.zip https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /opt
          /opt/gradle-9.5.0/bin/gradle --version

      - name: Resolve exact NEON build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/neon-deps/app/src/main/java/com/example/neondeps
          mkdir -p /tmp/neon-deps/app/src/main/res/values
          cat > /tmp/neon-deps/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NeonDeps"
          include(":app")
          EOF
          cat > /tmp/neon-deps/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.3.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF
          cat > /tmp/neon-deps/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.neondeps"
              compileSdk = 37
              defaultConfig {
                  applicationId = "com.example.neondeps"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true }
              packaging {
                  jniLibs.useLegacyPackaging = true
                  resources.excludes += setOf(
                      "/META-INF/{AL2.0,LGPL2.1}",
                      "META-INF/DEPENDENCIES",
                      "META-INF/LICENSE*",
                      "META-INF/NOTICE*",
                  )
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation(platform("androidx.compose:compose-bom:2026.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("info.guardianproject:tor-android:0.4.9.11")
              implementation("com.netzarchitekten:IPtProxy:5.5.1")
              implementation("com.zaneschepke:hevtunnel:1.0.1")
              testImplementation("junit:junit:4.13.2")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          cat > /tmp/neon-deps/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          cat > /tmp/neon-deps/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > /tmp/neon-deps/app/src/main/java/com/example/neondeps/MainActivity.kt <<'EOF'
          package com.example.neondeps
          import android.app.Activity
          class MainActivity : Activity()
          EOF
          cd /tmp/neon-deps
          /opt/gradle-9.5.0/bin/gradle --no-daemon --stacktrace assembleDebug

      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/export/android-sdk/platforms/android-37.0
          mkdir -p /tmp/export/android-sdk/build-tools/37.0.0
          cp "$ANDROID_HOME/platforms/android-37.0/android.jar" /tmp/export/android-sdk/platforms/android-37.0/
          cp -a "$ANDROID_HOME/build-tools/37.0.0/." /tmp/export/android-sdk/build-tools/37.0.0/
          cp /tmp/gradle-9.5.0-bin.zip /tmp/export/
          mkdir -p /tmp/export/gradle-home
          cp -a "$HOME/.gradle/caches" /tmp/export/gradle-home/
          cp -a "$HOME/.gradle/native" /tmp/export/gradle-home/ 2>/dev/null || true
          cp -a "$HOME/.gradle/notifications" /tmp/export/gradle-home/ 2>/dev/null || true
          cd /tmp/export
          tar -czf /tmp/neon-android-sdk.tgz android-sdk
          tar -czf /tmp/neon-gradle-cache.tgz gradle-home
          sha256sum /tmp/neon-android-sdk.tgz /tmp/neon-gradle-cache.tgz /tmp/gradle-9.5.0-bin.zip

      - name: Upload Android SDK
        uses: actions/upload-artifact@v4
        with:
          name: neon-android-sdk
          path: /tmp/neon-android-sdk.tgz
          retention-days: 7

      - name: Upload Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: neon-gradle-9.5
          path: /tmp/gradle-9.5.0-bin.zip
          retention-days: 7

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: neon-gradle-cache
          path: /tmp/neon-gradle-cache.tgz
          retention-days: 7
