name: Collect Godot local
on:
  push:
    branches: [collect-godot-local]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fL --retry 4 -o godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip'
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.1-linux
          path: Godot_v4.7.1-stable_linux.x86_64
          compression-level: 0
          retention-days: 1
