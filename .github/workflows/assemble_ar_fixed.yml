name: Assemble corrected AR model
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble_ar_fixed.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p ar_demo_20260829
          cat ar_demo_20260829/chunks_v4/part_*.b64 | base64 -d > ar_demo_20260829/character_ar_fixed_v4.glb
          test "$(wc -c < ar_demo_20260829/character_ar_fixed_v4.glb)" -eq 42776
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar_demo_20260829/character_ar_fixed_v4.glb
          git commit -m "Correct AR orientation and texture quality" || exit 0
          git push
