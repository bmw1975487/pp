name: RC4 generic proxy build

on:
  push:
    branches: [rc4-proxy-builder]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore generic builder
        run: |
          mkdir project
          base64 -d ci/rc4plugin.tar.gz.b64 > /tmp/p.tgz
          tar -xzf /tmp/p.tgz -C project
          sed -i 's/compileSdk = 37/compileSdk = 36/' project/app/build.gradle.kts
          sed -i 's/buildToolsVersion = "37.0.0"/buildToolsVersion = "36.0.0"/' project/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project/app/src/main/cpp/gojni2.cpp')
          s=p.read_text()
          old='innerH=android_dlopen_ext("/proc/self/fd/x",RTLD_NOW|RTLD_LOCAL,&ext);close(fd);memset(plain.data(),0,plain.size());if(!innerH)return JNI_ERR;\n  auto f=(jint(*)(JavaVM*,void*))dlsym(innerH,"JNI_OnLoad");if(!f)return JNI_ERR;return f(vm,nullptr);'
          new='char fdpath[64];snprintf(fdpath,sizeof(fdpath),"/proc/self/fd/%d",fd);innerH=android_dlopen_ext(fdpath,RTLD_NOW|RTLD_LOCAL,&ext);memset(plain.data(),0,plain.size());if(!innerH){close(fd);return JNI_ERR;}\n  auto f=(jint(*)(JavaVM*,void*))dlsym(innerH,"JNI_OnLoad");if(!f){close(fd);return JNI_ERR;}jint rr=f(vm,nullptr);close(fd);return rr;'
          assert old in s
          s=s.replace('#include <string>','#include <string>\n#include <cstdio>').replace(old,new)
          p.write_text(s)
          cm=Path('project/app/src/main/cpp/CMakeLists.txt')
          c=cm.read_text()
          Path('project/app/src/main/cpp/exports.map').write_text('{ global: JNI_OnLoad; local: *; };\n')
          c += '\ntarget_link_options(rc4x PRIVATE "-Wl,--version-script=${CMAKE_CURRENT_SOURCE_DIR}/exports.map" -Wl,--exclude-libs,ALL -Wl,--build-id=none)\n'
          c += 'target_link_options(gojni2 PRIVATE "-Wl,--version-script=${CMAKE_CURRENT_SOURCE_DIR}/exports.map" -Wl,--exclude-libs,ALL -Wl,--build-id=none)\n'
          cm.write_text(c)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: android-actions/setup-android@v3
      - name: Install toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build
        working-directory: project
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Collect
        run: |
          mkdir out
          cp project/app/build/outputs/apk/release/*.apk out/
          find project/app/build/intermediates -type f \( -name 'librc4x.so' -o -name 'libgojni2.so' \) -exec cp '{}' out/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: rc4-generic-proxy
          path: out/
          if-no-files-found: error
          retention-days: 1
