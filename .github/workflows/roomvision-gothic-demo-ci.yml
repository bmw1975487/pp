name: Room Vision Live 4.2 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roomvision:
    if: startsWith(github.head_ref, 'chatgpt/roomvision-neural-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 roomvision_gothic_demo/generate_assets.py
          test -s roomvision_gothic_demo/app/src/main/res/drawable/icon.png

      - name: Install public-domain neural style references
        shell: bash
        run: |
          set -euo pipefail
          STYLES='roomvision_gothic_demo/app/src/main/assets/styles'
          mkdir -p "$STYLES"
          curl -fL --retry 4 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/b/ba/TheStarryNightByVincentVanGogh.jpg' -o "$STYLES/van_gogh.jpg"
          curl -fL --retry 4 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Vassily_Kandinsky%2C_1913_-_Composition_7.jpg' -o "$STYLES/kandinsky.jpg"
          test "$(stat -c%s "$STYLES/van_gogh.jpg")" -gt 200000
          test "$(stat -c%s "$STYLES/kandinsky.jpg")" -gt 150000

      - name: Download official TensorFlow arbitrary style models
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='roomvision_gothic_demo/app/src/main/assets'
          mkdir -p "$ASSETS"
          curl -fL --retry 4 --retry-delay 2 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_predict_quantized_256.tflite' -o "$ASSETS/style_predict.tflite"
          curl -fL --retry 4 --retry-delay 2 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_transfer_quantized_dynamic.tflite' -o "$ASSETS/style_transform.tflite"
          test "$(stat -c%s "$ASSETS/style_predict.tflite")" -eq 2828838
          test "$(stat -c%s "$ASSETS/style_transform.tflite")" -eq 245046

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and lint
        working-directory: roomvision_gothic_demo
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean :app:assembleDebug :app:lintDebug --stacktrace
          RC=$?
          if [[ "$RC" -ne 0 ]]; then find app/build -name 'lint-results-debug.txt' -type f -print -exec cat {} \; || true; fi
          exit "$RC"

      - name: Verify ten-mode APK
        shell: bash
        run: |
          set -euo pipefail
          APK='roomvision_gothic_demo/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "APK_BYTES=$(stat -c%s "$APK")"
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$SDKROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$($SDKROOT/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.roomvision.filters.debug'"
          echo "$BADGING" | grep -F "versionName='4.2.0'"
          unzip -l "$APK" | grep -F 'assets/style_predict.tflite'
          unzip -l "$APK" | grep -F 'assets/style_transform.tflite'
          unzip -l "$APK" | grep -F 'assets/styles/van_gogh.jpg'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libopencv_java4.so'
          mkdir -p roomvision_dist
          cp "$APK" roomvision_dist/RoomVision_Live_10_Worlds_4.2.0.apk
          sha256sum roomvision_dist/RoomVision_Live_10_Worlds_4.2.0.apk > roomvision_dist/RoomVision_Live_10_Worlds_4.2.0.apk.sha256

      - name: Package complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf roomvision_gothic_demo/.gradle roomvision_gothic_demo/app/build roomvision_gothic_demo/build
          cd roomvision_gothic_demo
          zip -qr ../roomvision_dist/RoomVision_Live_10_Worlds_4.2.0_Source.zip . -x '*.DS_Store'
          cd ..

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Live_10_Worlds_4.2.0_FULL
          path: roomvision_dist/*
          if-no-files-found: error
          retention-days: 7
