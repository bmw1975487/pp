name: RoomVision Gothic Demo APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roomvision:
    if: startsWith(github.head_ref, 'chatgpt/roomvision-gothic-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: roomvision_gothic_demo
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace
      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="roomvision_gothic_demo/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$SDKROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p roomvision_dist
          cp "$APK" roomvision_dist/RoomVision_Gothic_Demo_0.1.0-debug.apk
          sha256sum roomvision_dist/RoomVision_Gothic_Demo_0.1.0-debug.apk > roomvision_dist/RoomVision_Gothic_Demo_0.1.0-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Gothic_Demo_0.1.0
          path: roomvision_dist/*
          if-no-files-found: error
          retention-days: 7
