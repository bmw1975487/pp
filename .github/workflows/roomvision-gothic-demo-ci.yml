name: RoomVision Neural 2.0 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roomvision:
    if: startsWith(github.head_ref, 'chatgpt/roomvision-neural-') || startsWith(github.head_ref, 'chatgpt/roomvision-gothic-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gothic world assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 roomvision_gothic_demo/generate_assets.py
          test -s roomvision_gothic_demo/app/src/main/assets/worlds/gothic_castle/stone_albedo.jpg
          test -s roomvision_gothic_demo/app/src/main/assets/worlds/gothic_castle/gothic_hero.jpg
          test -s roomvision_gothic_demo/app/src/main/res/drawable/icon.png

      - name: Download official TensorFlow arbitrary style models
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='roomvision_gothic_demo/app/src/main/assets'
          mkdir -p "$ASSETS"
          curl -fL --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_predict_quantized_256.tflite' \
            -o "$ASSETS/style_predict.tflite"
          curl -fL --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/download.tensorflow.org/models/tflite/arbitrary_style_transfer/style_transfer_quantized_dynamic.tflite' \
            -o "$ASSETS/style_transform.tflite"
          PREDICT_SIZE=$(stat -c%s "$ASSETS/style_predict.tflite")
          TRANSFORM_SIZE=$(stat -c%s "$ASSETS/style_transform.tflite")
          echo "STYLE_PREDICT_BYTES=$PREDICT_SIZE"
          echo "STYLE_TRANSFORM_BYTES=$TRANSFORM_SIZE"
          test "$PREDICT_SIZE" -eq 2828838
          test "$TRANSFORM_SIZE" -eq 245046
          sha256sum "$ASSETS/style_predict.tflite" "$ASSETS/style_transform.tflite"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and lint
        working-directory: roomvision_gothic_demo
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean :app:assembleDebug :app:lintDebug --stacktrace
          RC=$?
          if [[ "$RC" -ne 0 ]]; then
            echo '--- LINT TEXT REPORT ---'
            find app/build -name 'lint-results-debug.txt' -type f -print -exec cat {} \; || true
          fi
          exit "$RC"

      - name: Verify neural APK
        shell: bash
        run: |
          set -euo pipefail
          APK='roomvision_gothic_demo/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK_BYTES=$SIZE"
          if [[ "$SIZE" -lt 6000000 ]]; then
            echo 'ERROR: neural APK is unexpectedly small.'
            exit 31
          fi
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$SDKROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$($SDKROOT/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | head -n 20
          echo "$BADGING" | grep -F "package: name='com.roomvision.neural.debug'"
          unzip -l "$APK" | grep -F 'assets/style_predict.tflite'
          unzip -l "$APK" | grep -F 'assets/style_transform.tflite'
          mkdir -p roomvision_dist
          cp "$APK" roomvision_dist/RoomVision_Neural_Gothic_2.0.0.apk
          sha256sum roomvision_dist/RoomVision_Neural_Gothic_2.0.0.apk > roomvision_dist/RoomVision_Neural_Gothic_2.0.0.apk.sha256

      - name: Package complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf roomvision_gothic_demo/.gradle roomvision_gothic_demo/app/build roomvision_gothic_demo/build
          cd roomvision_gothic_demo
          zip -qr ../roomvision_dist/RoomVision_Neural_Gothic_2.0.0_Source.zip . -x '*.DS_Store'
          cd ..
          test -s roomvision_dist/RoomVision_Neural_Gothic_2.0.0_Source.zip

      - name: Upload neural build
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Neural_Gothic_2.0.0_FULL
          path: roomvision_dist/*
          if-no-files-found: error
          retention-days: 7
