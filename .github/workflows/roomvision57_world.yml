name: RoomVision 5.7 Full Room Gothic World APK

on:
  push:
    paths:
      - '.github/workflows/roomvision57_world.yml'
      - 'roomvision57_world.patch'
      - 'roomvision57_no_cge.patch'
      - 'roomvision57_no_arcore.patch'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: roomvision57-full-room-world
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and patch RoomVision 5.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat roomvision55_seed/part_*.b64 | tr -d '\n\r ' | base64 -d | tar -xz

          # Most of the 5.7 patch applies cleanly. One controller hunk can differ
          # because the 5.5 CI already guarded close(); apply the rest, then enforce
          # the final controller method below with deterministic Python replacement.
          patch -p1 --forward < roomvision57_world.patch || true
          patch -p1 --forward < roomvision57_no_cge.patch || true
          patch -p1 --forward < roomvision57_no_arcore.patch

          python - <<'PY'
          from pathlib import Path

          # Version.
          g=Path('app/build.gradle.kts')
          s=g.read_text()
          s=s.replace('versionCode = 55','versionCode = 57').replace('versionCode = 56','versionCode = 57')
          s=s.replace('versionName = "5.5.0"','versionName = "5.7.0"').replace('versionName = "5.6.0"','versionName = "5.7.0"')
          g.write_text(s)

          # Force the active Gothic path to be full-frame only, never CGE overlay.
          p=Path('app/src/main/java/com/roomvision/demo/NeuralCameraController.java')
          s=p.read_text()
          a=s.index('    private Bitmap renderGothic(Bitmap raw) {')
          b=s.index('    private String gothicEngineLabel() {', a)
          render='''    private Bitmap renderGothic(Bitmap raw) {\n        // 5.7: same ownership model as Matrix: transform every camera frame.\n        // No ARCore plane renderer and no castle texture pasted over the screen.\n        if (Build.VERSION.SDK_INT >= 33) {\n            try {\n                if (gothicGpuFallback == null) gothicGpuFallback = new AgslGothicRenderer(activity);\n                return gothicGpuFallback.render(raw, SystemClock.uptimeMillis(), 0f, 0f);\n            } catch (Throwable t) {\n                Log.w(TAG, "Full-frame Gothic AGSL unavailable; falling back", t);\n                if (android.os.Build.VERSION.SDK_INT >= 33 && gothicGpuFallback != null) {\n                    try { gothicGpuFallback.close(); } catch (Throwable ignored) { }\n                }\n                gothicGpuFallback = null;\n            }\n        }\n        return artEngine.process(raw, FilterType.GOTHIC);\n    }\n\n'''
          s=s[:a]+render+s[b:]
          a=s.index('    private String gothicEngineLabel() {')
          b=s.index('    private void updateFps()', a)
          label='''    private String gothicEngineLabel() {\n        if (Build.VERSION.SDK_INT >= 33 && gothicGpuFallback != null)\n            return "GOTHIC • FULL ROOM WORLD / AGSL";\n        return "GOTHIC • FULL ROOM WORLD / CPU";\n    }\n\n'''
          s=s[:a]+label+s[b:]
          if '@android.annotation.SuppressLint("NewApi")\n    void stop() {' not in s:
              s=s.replace('    void stop() {','    @android.annotation.SuppressLint("NewApi")\n    void stop() {',1)
          p.write_text(s)
          PY

          grep -F 'versionName = "5.7.0"' app/build.gradle.kts
          grep -F 'versionCode = 57' app/build.gradle.kts
          grep -F 'Gothic is a full-frame WORLD effect like Matrix' app/src/main/java/com/roomvision/demo/MainActivity.java
          grep -F 'ARCore GothicArView is deliberately not created' app/src/main/java/com/roomvision/demo/MainActivity.java
          grep -F 'never resume ARCore here' app/src/main/java/com/roomvision/demo/MainActivity.java
          grep -F 'FULL ROOM WORLD / AGSL' app/src/main/java/com/roomvision/demo/NeuralCameraController.java
          if grep -A35 'private Bitmap renderGothic' app/src/main/java/com/roomvision/demo/NeuralCameraController.java | grep -q 'cge.render'; then
            echo 'ERROR: CGE overlay remains in active Gothic path'; exit 1
          fi
          if grep -A25 'private void selectLiveMode' app/src/main/java/com/roomvision/demo/MainActivity.java | grep -q 'resumeWorld'; then
            echo 'ERROR: Gothic still switches to ARCore'; exit 2
          fi

      - name: Generate Gothic world assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python generate_assets_ci.py
          mkdir -p app/src/main/assets
          curl -A 'RoomVision-Build/5.7' -L --fail --retry 3 --retry-delay 2 \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/castle_wall_slates/castle_wall_slates_diff_4k.jpg' \
            -o app/src/main/assets/castle_wall_slates_diff_2k.jpg
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite' \
            -o app/src/main/assets/object_detector.tflite
          test $(stat -c%s app/src/main/assets/castle_wall_slates_diff_2k.jpg) -gt 8000000
          test $(stat -c%s app/src/main/assets/object_detector.tflite) -gt 4000000

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 / Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint test assemble
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee reports/build.log

      - name: Verify full-room APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee reports/apksigner.txt
          "$BT/aapt2" dump badging "$APK" | tee reports/aapt2-badging.txt
          grep -F "versionName='5.7.0'" reports/aapt2-badging.txt
          unzip -l "$APK" | tee reports/apk-files.txt
          for d in $(zipinfo -1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$d"; done | strings > reports/dex-strings.txt
          grep -F 'GOTHIC • FULL ROOM WORLD / AGSL' reports/dex-strings.txt
          grep -F 'Gothic World' reports/dex-strings.txt
          grep -F 'MATRIX WORLD' reports/dex-strings.txt
          mkdir -p dist
          cp "$APK" dist/RoomVision_Gothic_5.7.0_FULL_ROOM_WORLD.apk
          stat -c 'apk_bytes=%s' dist/RoomVision_Gothic_5.7.0_FULL_ROOM_WORLD.apk | tee reports/apk-size.txt
          sha256sum dist/RoomVision_Gothic_5.7.0_FULL_ROOM_WORLD.apk | tee dist/SHA256.txt

      - name: Package source
        if: success()
        shell: bash
        run: |
          zip -qr dist/RoomVision_Gothic_5.7.0_FULL_ROOM_WORLD_Source.zip app build.gradle.kts settings.gradle.kts gradle.properties generate_assets_ci.py reports -x 'app/build/*' 'build/*'

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Gothic_5.7.0_FULL_ROOM_WORLD
          path: |
            dist/*
            reports/*
          if-no-files-found: warn
          retention-days: 14
