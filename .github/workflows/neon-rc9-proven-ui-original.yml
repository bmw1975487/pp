name: Neon RC9 Original UI Proven Route

on:
  push:
    branches: [ neon-rc9-working6 ]
    paths:
      - 'freegpt-rc9/BUILD_TRIGGER_ORIGINAL'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project overlay
        uses: actions/checkout@v4

      - name: Java 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' 'platform-tools' 'ndk;29.0.14206865'

      - name: Verify original supplied Neon interface files
        run: |
          echo 'ce1192e8584104586b72d8cd664de972af2ee92848897c7013f6c71f831c8ea1  freegpt-rc9/original_ui/01_icon.jpg' | sha256sum -c -
          echo '133e0a58a5564405afcf72ca7ab82c9e17f412246d0a6ae9ba21198e3a875865  freegpt-rc9/original_ui/02_main_screen.jpg' | sha256sum -c -
          echo 'cd47567fdcb3a36cc51b8d2cbf0599733c63e312fc134645e00d639d94adabd1  freegpt-rc9/original_ui/04_connection_screen.jpg' | sha256sum -c -
          echo 'b8d3c8a06eb20a4c3684060383e4b3ced244353a426937772c65e5f993cd88bc  freegpt-rc9/original_ui/05_technical_log.jpg' | sha256sum -c -

      - name: Reconstruct historical RC2 artwork required by patch chain
        run: |
          cat freegpt-rc2/assets_b64/part00.txt \
              freegpt-rc2/assets_b64/part01.txt \
              freegpt-rc2/assets_b64/part02.txt \
              freegpt-rc2/assets_b64/part03.txt \
              freegpt-rc2/assets_b64/part04.txt \
              freegpt-rc2/assets_b64/part05.txt \
              freegpt-rc2/assets_b64/part06.txt \
              freegpt-rc2/assets_b64/part07.txt \
              freegpt-rc2/assets_b64/part08.txt \
              freegpt-rc2/assets_b64/part09.txt \
              freegpt-rc2/assets_b64/part10.txt > /tmp/freegpt_assets.b64
          base64 -d /tmp/freegpt_assets.b64 > /tmp/freegpt_tiny.zip
          echo '723d55ec73f17bed3529ce66a00af7d0284c4ee3dd33c248e70afa44beb4d122  /tmp/freegpt_tiny.zip' | sha256sum -c -
          rm -rf /tmp/freegpt_assets && mkdir -p /tmp/freegpt_assets
          unzip -q /tmp/freegpt_tiny.zip -d /tmp/freegpt_assets

      - name: Clone pinned Orbot source
        run: |
          git clone https://github.com/guardianproject/orbot-android.git orbot-src
          cd orbot-src
          git checkout 521d18aa3cd320f5762a57e0bcf9fcf0c8eba15a
          git submodule update --init --recursive

      - name: Apply physically proven browser networking base
        run: |
          python3 ai-access-orbot/patch_orbot.py orbot-src ai-access-orbot/overlay
          python3 ai-access-orbot/patch_noprofile.py orbot-src
          python3 ai-access-orbot/patch_autotarget.py orbot-src
          python3 ai-access-orbot/patch_browseronly.py orbot-src
          python3 ai-access-orbot/patch_twoscreen.py orbot-src
          python3 ai-access-orbot/patch_freegpt.py orbot-src

      - name: Apply corrections through strict RC7 route verification
        run: |
          mkdir -p orbot-src/app/src/main/res/drawable-nodpi
          cp /tmp/freegpt_assets/01_welcome.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_screen_welcome.webp
          cp /tmp/freegpt_assets/02_select.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_screen_select.webp
          cp /tmp/freegpt_assets/03_settings.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_screen_settings.webp
          cp /tmp/freegpt_assets/04_products.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_screen_products.webp
          cp /tmp/freegpt_assets/05_pay.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_screen_pay.webp
          cp /tmp/freegpt_assets/ic_launcher.webp orbot-src/app/src/main/res/drawable-nodpi/freegpt_user_icon.webp
          python3 freegpt-rc2/patch_user_screens.py orbot-src
          python3 freegpt-rc3/patch_live_status.py orbot-src
          python3 freegpt-rc4/patch_service_probe_log.py orbot-src
          python3 freegpt-rc5/patch_rc5_ux.py orbot-src
          python3 freegpt-rc6/patch_rc6_local_only.py orbot-src
          python3 freegpt-rc7/patch_rc7_strict_ready.py orbot-src

      - name: Install original three Neon screens and icon
        run: |
          cp freegpt-rc9/original_ui/01_icon.jpg orbot-src/app/src/main/res/drawable-nodpi/neon_icon.jpg
          cp freegpt-rc9/original_ui/02_main_screen.jpg orbot-src/app/src/main/res/drawable-nodpi/neon_main.jpg
          cp freegpt-rc9/original_ui/04_connection_screen.jpg orbot-src/app/src/main/res/drawable-nodpi/neon_connection.jpg
          cp freegpt-rc9/original_ui/05_technical_log.jpg orbot-src/app/src/main/res/drawable-nodpi/neon_technical.jpg
          python3 freegpt-rc9/patch_neon_proven_ui.py orbot-src

      - name: Validate final source and original artwork
        run: |
          ACT=orbot-src/app/src/main/java/org/torproject/android/AiAccessActivity.java
          grep -n 'applicationId = "com.freegpt.access"' orbot-src/app/build.gradle.kts
          grep -n '1.0.0-rc9-neon-proven' orbot-src/app/build.gradle.kts
          grep -n 'android:label="Neon"' orbot-src/app/src/main/AndroidManifest.xml
          grep -n '@drawable/neon_icon' orbot-src/app/src/main/AndroidManifest.xml
          grep -n 'NEON_UI_SCREEN' "$ACT"
          grep -n 'NEON_SERVICE_DENIED' "$ACT"
          grep -n 'PROVIDER_VERIFIED_STRICT' "$ACT"
          grep -n 'FALSE_READY_BLOCKED' "$ACT"
          grep -n 'AI_WEB_OPEN' "$ACT"
          grep -n 'https://chatgpt.com/' "$ACT"
          grep -n 'https://gemini.google.com/' "$ACT"
          ! grep -n 'androidx.webkit.ProxyController' "$ACT"
          ! grep -n 'RC8_WEBVIEW' "$ACT"
          echo 'ce1192e8584104586b72d8cd664de972af2ee92848897c7013f6c71f831c8ea1  orbot-src/app/src/main/res/drawable-nodpi/neon_icon.jpg' | sha256sum -c -
          echo '133e0a58a5564405afcf72ca7ab82c9e17f412246d0a6ae9ba21198e3a875865  orbot-src/app/src/main/res/drawable-nodpi/neon_main.jpg' | sha256sum -c -
          echo 'cd47567fdcb3a36cc51b8d2cbf0599733c63e312fc134645e00d639d94adabd1  orbot-src/app/src/main/res/drawable-nodpi/neon_connection.jpg' | sha256sum -c -
          echo 'b8d3c8a06eb20a4c3684060383e4b3ced244353a426937772c65e5f993cd88bc  orbot-src/app/src/main/res/drawable-nodpi/neon_technical.jpg' | sha256sum -c -

      - name: Build arm64 APK
        working-directory: orbot-src
        run: ./gradlew --no-daemon --stacktrace assembleFullpermDebug

      - name: Verify final Neon APK
        run: |
          APK=$(find orbot-src/app/build/outputs/apk/fullperm/debug -type f -name '*.apk' | grep -E 'arm64|v8a' | head -1)
          if [ -z "$APK" ]; then APK=$(find orbot-src/app/build/outputs/apk/fullperm/debug -type f -name '*.apk' | head -1); fi
          test -n "$APK"
          echo "APK=$APK" | tee freegpt-rc9/build-info-original.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" | tee -a freegpt-rc9/build-info-original.txt
          sha256sum "$APK" | tee freegpt-rc9/Neon_RC9_ORIGINAL.sha256
          echo '--- exact original UI resources ---' | tee -a freegpt-rc9/build-info-original.txt
          unzip -l "$APK" | grep -E 'neon_(main|connection|technical|icon)' | tee -a freegpt-rc9/build-info-original.txt
          echo '--- functional DEX markers ---' | tee -a freegpt-rc9/build-info-original.txt
          for DEX in $(zipinfo -1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$DEX" | strings; done | grep -E '1.0.0-rc9-neon-proven|NEON_UI_SCREEN|NEON_SERVICE_DENIED|PROVIDER_VERIFIED_STRICT|FALSE_READY_BLOCKED|AI_WEB_OPEN|SERVICE_ROUTE_ACCEPTED|chatgpt.com|gemini.google.com' | head -320 | tee -a freegpt-rc9/build-info-original.txt || true
          cp "$APK" freegpt-rc9/Neon_RC9_ORIGINAL_UI.apk

      - name: Upload Neon original UI build
        uses: actions/upload-artifact@v4
        with:
          name: Neon_RC9_ORIGINAL_UI
          path: |
            freegpt-rc9/Neon_RC9_ORIGINAL_UI.apk
            freegpt-rc9/Neon_RC9_ORIGINAL.sha256
            freegpt-rc9/build-info-original.txt
          if-no-files-found: error
          retention-days: 14
