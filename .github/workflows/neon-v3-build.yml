name: Neon V3 Android Build

on:
  push:
    branches:
      - build/neon-v3-test
    paths:
      - v3-build-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore and verify V3 engine
        run: |
          set -euo pipefail
          mkdir -p v3project/v3test/src/main/python
          cat v3python2/neon_v3_engine.py.part* > v3project/v3test/src/main/python/neon_v3_engine.py
          python3 -m py_compile v3project/v3test/src/main/python/neon_v3_engine.py
          grep -F 'ENGINE_ID = "neon.presentation.parallel.v3"' v3project/v3test/src/main/python/neon_v3_engine.py
          grep -F '"fallback": "DISABLED"' v3project/v3test/src/main/python/neon_v3_engine.py
          ! grep -F 'runOldEngine' v3project/v3test/src/main/python/neon_v3_engine.py
          mkdir -p v3project/v3test/src/main/assets
          python3 -m pip install --quiet python-pptx==1.0.2
          python3 - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches
          p='v3project/v3test/src/main/assets/presentation_template_v3.pptx'
          prs=Presentation()
          prs.slide_width=Inches(13.333333)
          prs.slide_height=Inches(7.5)
          prs.save(p)
          PY
          unzip -tq v3project/v3test/src/main/assets/presentation_template_v3.pptx

      - name: Build Neon V3 debug APK
        working-directory: v3project
        run: |
          set -euo pipefail
          gradle --no-daemon :v3test:assembleDebug --stacktrace

      - name: Verify and prepare artifact
        run: |
          set -euo pipefail
          APK='v3project/v3test/build/outputs/apk/debug/v3test-debug.apk'
          test -s "$APK"
          unzip -tq "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Neon_V3.apk
          sha256sum artifacts/Neon_V3.apk | tee artifacts/Neon_V3.sha256.txt
          printf 'source_commit=%s\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt
          printf 'package=ru.nika.v3test\n' >> artifacts/BUILD_INFO.txt
          printf 'engine=neon.presentation.parallel.v3\n' >> artifacts/BUILD_INFO.txt
          printf 'fallback=DISABLED\n' >> artifacts/BUILD_INFO.txt
          printf 'final_actions=OPEN,SEND\n' >> artifacts/BUILD_INFO.txt
          unzip -l artifacts/Neon_V3.apk | grep -E 'classes.*dex|neon_v3_engine|presentation_template_v3'

      - name: Upload Neon V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon_V3_Android
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
