name: Neon V3 Android Build

on:
  push:
    branches:
      - build/neon-v3-test
    paths:
      - v3layout12/trigger.txt
      - .github/workflows/neon-v3-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore V3 1.2 engine and build placeholder template
        run: |
          set -euo pipefail
          python3 -m pip install --quiet python-pptx==1.0.2 Pillow==11.3.0
          PY=v3project/v3test/src/main/python
          ASSETS=v3project/v3test/src/main/assets
          mkdir -p "$PY" "$ASSETS"
          cat v3layout12/engine.part00 v3layout12/engine.part01 v3layout12/engine.part02 v3layout12/engine.part03 > "$PY/neon_v3_engine.py"
          python3 -m py_compile "$PY/neon_v3_engine.py"
          grep -F 'ENGINE_VERSION = "1.2.0"' "$PY/neon_v3_engine.py"
          grep -F 'TEXT_PLAN' "$PY/neon_v3_engine.py" >/dev/null
          grep -F 'LAYOUT_PLAN' "$PY/neon_v3_engine.py" >/dev/null
          grep -F 'IMAGE_GENERATE' "$PY/neon_v3_engine.py" >/dev/null
          grep -F '"fallback": "DISABLED"' "$PY/neon_v3_engine.py"
          ! grep -F 'runOldEngine' "$PY/neon_v3_engine.py"
          python3 - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches
          p='v3project/v3test/src/main/assets/presentation_template_v3.pptx'
          prs=Presentation()
          prs.slide_width=Inches(13.333333)
          prs.slide_height=Inches(7.5)
          while len(prs.slides) < 9:
              prs.slides.add_slide(prs.slide_layouts[6])
          prs.save(p)
          PY
          unzip -tq "$ASSETS/presentation_template_v3.pptx"
      - name: Set V3 app version
        run: |
          FILE=v3project/v3test/build.gradle
          sed -i 's/versionCode 2/versionCode 4/' "$FILE"
          sed -i "s/versionName '1.0.0-v3'/versionName '1.2.1-v3'/" "$FILE"
      - name: Build APK
        working-directory: v3project
        run: gradle --no-daemon :v3test:assembleDebug --stacktrace
      - name: Prepare artifact and Android signing tools
        run: |
          set -euo pipefail
          mkdir -p artifacts/sign-tools
          APK=v3project/v3test/build/outputs/apk/debug/v3test-debug.apk
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -s "$APK"
          cp "$APK" artifacts/Neon_V3_placeholder.apk
          cp "$ZIPALIGN" artifacts/sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/sign-tools/
          chmod +x artifacts/sign-tools/zipalign
          ldd "$ZIPALIGN" | tee artifacts/sign-tools/zipalign.ldd.txt
          LIBCPP=$(ldd "$ZIPALIGN" | awk '/libc\+\+\.so/ {print $3; exit}')
          test -n "$LIBCPP" -a -f "$LIBCPP"
          cp -L "$LIBCPP" artifacts/sign-tools/libc++.so
          for lib in libc++abi.so.1 libunwind.so.1; do
            path=$(ldconfig -p | awk -v n="$lib" '$1 == n {print $NF; exit}')
            if [ -n "$path" ] && [ -f "$path" ]; then
              cp -L "$path" "artifacts/sign-tools/$lib"
            fi
          done
          LD_LIBRARY_PATH="$PWD/artifacts/sign-tools" artifacts/sign-tools/zipalign -h >/dev/null
          sha256sum artifacts/Neon_V3_placeholder.apk > artifacts/placeholder.sha256.txt
          cat > artifacts/BUILD_INFO.txt <<EOF
          app=Neon V3
          package=ru.nika.v3test
          versionName=1.2.1-v3
          versionCode=4
          engine=neon.presentation.parallel.v3
          engineVersion=1.2.0
          fallback=DISABLED
          pipeline=TEXT_PLAN->LAYOUT_PLAN->IMAGE_GENERATE->PPTX_ASSEMBLE
          finalActions=OPEN,SEND
          note=placeholder template must be replaced by user-approved PPTX before signing
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Neon_V3_1_2_1_Build
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
