name: RoomVision 5.9 Gothic Depth Material APK

on:
  push:
    paths:
      - '.github/workflows/roomvision59_depth_material.yml'
      - 'roomvision59_override_parts/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: roomvision59-depth-material
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore 5.5 base and apply 5.9 depth-material override
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat roomvision55_seed/part_*.b64 | tr -d '\n\r ' | base64 -d | tar -xz
          cat roomvision59_override_parts/part_*.b64 | tr -d '\n\r ' | base64 -d | tar -xz

          G=app/src/main/java/com/roomvision/demo/GothicArView.java
          grep -F 'versionCode = 59' app/build.gradle.kts
          grep -F 'versionName = "5.9.0"' app/build.gradle.kts
          grep -F 'Room Vision Gothic 5.9' app/src/main/res/values/strings.xml
          grep -F 'Config.DepthMode.AUTOMATIC' "$G"
          grep -F 'Config.PlaneFindingMode.DISABLED' "$G"
          grep -F 'frame.acquireDepthImage16Bits()' "$G"
          grep -F 'cameraPose.transformPoint' "$G"
          grep -F 'texture2D(uStone,p.yz*s)' "$G"
          grep -F 'texture2D(uStone,p.xz*s)' "$G"
          grep -F 'texture2D(uStone,p.xy*s)' "$G"
          grep -F 'glDrawArrays(GLES20.GL_TRIANGLES' "$G"

          if grep -q 'import com.google.ar.core.Plane;' "$G"; then
            echo 'ERROR: tracked-plane renderer returned'; exit 11
          fi
          if grep -q 'getPolygon()' "$G"; then
            echo 'ERROR: plane polygon renderer returned'; exit 12
          fi
          if grep -q 'getAllTrackables' "$G"; then
            echo 'ERROR: plane trackables returned'; exit 13
          fi
          if grep -q 'pyrMeanShiftFiltering\|Imgproc.Canny\|SurfaceGothicEngine' "$G"; then
            echo 'ERROR: Cartoon/OpenCV Gothic returned'; exit 14
          fi

      - name: Generate Gothic material assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python generate_assets_ci.py | tee reports/assets.txt
          test -s app/src/main/assets/castle_wall_slates_diff_2k.jpg
          test -s app/src/main/res/drawable/icon.png
          stat -c 'castle_material_bytes=%s' app/src/main/assets/castle_wall_slates_diff_2k.jpg | tee -a reports/assets.txt

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36 / Build Tools 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Clean lint test assemble
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee reports/build.log

      - name: Verify 5.9 depth-material APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee reports/apksigner.txt
          "$BT/aapt2" dump badging "$APK" | tee reports/aapt2-badging.txt
          grep -F "versionName='5.9.0'" reports/aapt2-badging.txt
          grep -F "application-label:'Room Vision Gothic 5.9'" reports/aapt2-badging.txt
          unzip -l "$APK" | tee reports/apk-files.txt
          grep -F 'assets/castle_wall_slates_diff_2k.jpg' reports/apk-files.txt
          for d in $(zipinfo -1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$d"; done | strings > reports/dex-strings.txt
          grep -F 'acquireDepthImage16Bits' reports/dex-strings.txt
          grep -F 'CameraIntrinsics' reports/dex-strings.txt
          grep -F 'RoomVisionDepthMaterial' reports/dex-strings.txt
          mkdir -p dist
          cp "$APK" dist/RoomVision_Gothic_5.9.0_DEPTH_MATERIALWRAP.apk
          stat -c 'apk_bytes=%s' dist/RoomVision_Gothic_5.9.0_DEPTH_MATERIALWRAP.apk | tee reports/apk-size.txt
          sha256sum dist/RoomVision_Gothic_5.9.0_DEPTH_MATERIALWRAP.apk | tee dist/SHA256.txt

      - name: Package source
        if: success()
        shell: bash
        run: |
          zip -qr dist/RoomVision_Gothic_5.9.0_DEPTH_MATERIALWRAP_Source.zip app build.gradle.kts settings.gradle.kts gradle.properties generate_assets_ci.py reports -x 'app/build/*' 'build/*'

      - name: Upload APK source and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoomVision_Gothic_5.9.0_DEPTH_MATERIALWRAP
          path: |
            dist/*
            reports/*
          if-no-files-found: warn
          retention-days: 14
