name: Fetch Pixel Lense APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-pixel-lense:
    if: startsWith(github.head_ref, 'chatgpt/pixel-lense-apk-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install APK downloader
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/kiber-io/apkd.git'
          apkd --help | head -n 40

      - name: Download exact package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pixel_lense_download
          cd pixel_lense_download
          if ! apkd -p com.hiro.pixellense -d -s apkcombo; then
            echo 'APKCombo attempt failed; trying APKPure source'
            apkd -p com.hiro.pixellense -d -s apkpure
          fi
          echo '--- downloaded files ---'
          find . -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Ensure Android verification tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          if ! find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | grep -q .; then
            SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'build-tools;35.0.0' 'platform-tools'
          fi

      - name: Verify package and signature
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          APK="$(find pixel_lense_download -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            XAPK="$(find pixel_lense_download -type f \( -name '*.xapk' -o -name '*.apks' \) | head -n 1)"
            if [[ -n "$XAPK" ]]; then
              mkdir -p extracted
              unzip -q "$XAPK" -d extracted
              APK="$(find extracted -type f -name '*.apk' | while read -r f; do if "$AAPT" dump badging "$f" 2>/dev/null | grep -q "package: name='com.hiro.pixellense'"; then echo "$f"; break; fi; done)"
            fi
          fi
          test -n "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | head -n 30
          echo "$BADGING" | grep -F "package: name='com.hiro.pixellense'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p pixel_lense_dist
          cp "$APK" pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk
          sha256sum pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk | tee pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk.sha256
          {
            echo 'SOURCE_PACKAGE=com.hiro.pixellense'
            echo 'GOOGLE_PLAY=https://play.google.com/store/apps/details?id=com.hiro.pixellense'
            echo "BYTES=$(stat -c%s pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk)"
            echo
            "$AAPT" dump badging pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk | head -n 20
            echo
            "$APKSIGNER" verify --verbose --print-certs pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk
          } > pixel_lense_dist/VERIFY.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel_Lense_Camera_into_Art_ORIGINAL
          path: pixel_lense_dist/*
          if-no-files-found: error
          retention-days: 7
