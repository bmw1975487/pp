name: Fetch Pixel Lense APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-pixel-lense:
    if: startsWith(github.head_ref, 'chatgpt/pixel-lense-apk-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install direct Google Play downloader
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'goopdl>=1.0.0'
          goopdl --help | head -n 40

      - name: Anonymous Google Play authentication
        shell: bash
        run: |
          set -euxo pipefail
          goopdl auth --country US

      - name: Download exact Google Play package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pixel_lense_download
          goopdl info com.hiro.pixellense --country US
          goopdl download com.hiro.pixellense -o pixel_lense_download --country US --no-extras
          echo '--- downloaded files ---'
          find pixel_lense_download -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          test -n "$(find pixel_lense_download -type f -name '*.apk' -print -quit)"

      - name: Ensure Android verification tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          if ! find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | grep -q .; then
            SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'build-tools;35.0.0' 'platform-tools'
          fi

      - name: Verify package and original signatures
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          mkdir -p pixel_lense_dist

          BASE=''
          EXPECTED_SIGNER=''
          : > pixel_lense_dist/VERIFY.txt
          for APK in $(find pixel_lense_download -type f -name '*.apk' | sort); do
            BADGING="$($AAPT dump badging "$APK")"
            echo "$BADGING" | grep -F "package: name='com.hiro.pixellense'"
            CERT="$($APKSIGNER verify --verbose --print-certs "$APK")"
            echo "===== $APK =====" >> pixel_lense_dist/VERIFY.txt
            echo "$BADGING" | head -n 20 >> pixel_lense_dist/VERIFY.txt
            echo >> pixel_lense_dist/VERIFY.txt
            echo "$CERT" >> pixel_lense_dist/VERIFY.txt
            echo >> pixel_lense_dist/VERIFY.txt
            SIGNER="$(echo "$CERT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            test -n "$SIGNER"
            if [[ -z "$EXPECTED_SIGNER" ]]; then EXPECTED_SIGNER="$SIGNER"; fi
            test "$SIGNER" = "$EXPECTED_SIGNER"
            if ! echo "$BADGING" | head -n 1 | grep -q " split='"; then BASE="$APK"; fi
          done
          test -n "$BASE"
          echo "BASE_APK=$BASE"
          echo "SIGNER_SHA256=$EXPECTED_SIGNER"
          cp "$BASE" pixel_lense_dist/Pixel_Lense_BASE_original.apk
          sha256sum pixel_lense_dist/Pixel_Lense_BASE_original.apk > pixel_lense_dist/Pixel_Lense_BASE_original.apk.sha256

          APK_COUNT="$(find pixel_lense_download -type f -name '*.apk' | wc -l)"
          echo "APK_COUNT=$APK_COUNT" | tee -a pixel_lense_dist/VERIFY.txt
          if [[ "$APK_COUNT" -eq 1 ]]; then
            cp "$BASE" pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk
            sha256sum pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk > pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk.sha256
          else
            (cd pixel_lense_download && zip -q ../pixel_lense_dist/Pixel_Lense_Original_GooglePlay_Splits.zip ./*.apk)
            sha256sum pixel_lense_dist/Pixel_Lense_Original_GooglePlay_Splits.zip > pixel_lense_dist/Pixel_Lense_Original_GooglePlay_Splits.zip.sha256
          fi

      - name: Upload verified original package
        uses: actions/upload-artifact@v4
        with:
          name: Pixel_Lense_Camera_into_Art_ORIGINAL_GOOGLE_PLAY
          path: pixel_lense_dist/*
          if-no-files-found: error
          retention-days: 7
