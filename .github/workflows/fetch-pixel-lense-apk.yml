name: Fetch Pixel Lense APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-pixel-lense:
    if: startsWith(github.head_ref, 'chatgpt/pixel-lense-apk-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact Pixel Lense package from APKPure CDN
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pixel_lense_dist
          wget --user-agent='Mozilla/5.0' --content-disposition \
            -O pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk \
            'https://d.apkpure.com/b/APK/com.hiro.pixellense?version=latest'
          file pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk
          stat -c '%n %s bytes' pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk
          test "$(stat -c%s pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk)" -gt 1000000

      - name: Ensure Android verification tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDKROOT"
          if ! find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | grep -q .; then
            SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" 'build-tools;35.0.0' 'platform-tools'
          fi

      - name: Verify exact package and signature
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          APK='pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk'
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | head -n 30
          echo "$BADGING" | grep -F "package: name='com.hiro.pixellense'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee pixel_lense_dist/SIGNATURE.txt
          sha256sum "$APK" | tee pixel_lense_dist/Pixel_Lense_Camera_into_Art.apk.sha256
          {
            echo 'SOURCE=APKPure CDN'
            echo 'EXPECTED_PACKAGE=com.hiro.pixellense'
            echo "BYTES=$(stat -c%s "$APK")"
            echo
            echo "$BADGING" | head -n 25
          } > pixel_lense_dist/VERIFY.txt

      - name: Upload verified Pixel Lense APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel_Lense_Camera_into_Art_VERIFIED_APK
          path: pixel_lense_dist/*
          if-no-files-found: error
          retention-days: 7
