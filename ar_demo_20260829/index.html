<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b1f">
<title>AR персонаж</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#070b1f;color:white;font-family:Arial,sans-serif;overflow:hidden}
model-viewer{width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#26346e 0%,#0c1335 42%,#050713 100%)}
.hint{position:fixed;left:12px;right:12px;top:12px;z-index:5;text-align:center;font-size:16px;line-height:1.3;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:14px;backdrop-filter:blur(8px)}
#ar-button{background:#fff;color:#10152f;border:0;border-radius:999px;padding:14px 22px;font-size:18px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="hint">Android: нажмите «Поставить в комнату», затем наведите камеру на пол.</div>
<model-viewer
  src="https://cdn.jsdelivr.net/gh/bmw1975487/pp@main/ar_demo_20260829/character_ar_2_5d.glb"
  alt="AR персонаж"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  exposure="1"
  ar
  ar-modes="scene-viewer webxr"
  ar-placement="floor"
  ar-scale="auto">
  <button slot="ar-button" id="ar-button">Поставить в комнату</button>
</model-viewer>
</body>
</html>
