<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b1f"><title>AR персонаж FIX</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#070b1f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}model-viewer{width:100%;height:100%;background:#070b1f}#ar{background:#fff;color:#111;border:0;border-radius:999px;padding:16px 24px;font-size:18px;font-weight:700}#msg{position:fixed;top:14px;left:14px;right:14px;text-align:center;z-index:4;background:#000a;padding:10px;border-radius:12px}</style></head><body><div id="msg">Загрузка исправленного AR…</div><model-viewer id="mv" camera-controls ar ar-modes="webxr" ar-placement="floor" ar-scale="fixed" shadow-intensity="0"><button id="ar" slot="ar-button">Поставить в комнату</button></model-viewer><script>
(async()=>{try{const files=['chunks_v4/part_00.b64','chunks_v4/part_01.b64','chunks_v4/part_02.b64','chunks_v4/part_03.b64','chunks_v4/part_04.b64','chunks_v4/part_05.b64','chunks_v4/part_06.b64','chunks_v4/part_07.b64'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(f);return(await r.text()).trim()}));const raw=atob(parts.join(''));const a=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);const u=URL.createObjectURL(new Blob([a],{type:'model/gltf-binary'}));document.getElementById('mv').src=u;document.getElementById('msg').textContent='Исправлено: головой вверх. Нажмите «Поставить в комнату».';}catch(e){document.getElementById('msg').textContent='Ошибка загрузки AR: '+e.message;}})();
</script></body></html>
